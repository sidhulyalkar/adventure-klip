name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install package and test requirements
        run: python -m pip install -e '.[dev,vision,images]'
      - name: Check package
        run: python -m build --sdist --wheel
      - name: Check browser JavaScript
        run: node --check src/adventure_intelligence/studio_assets/studio.js
      - name: Verify packaged studio assets
        run: |
          python -c "import glob,zipfile; p=glob.glob('dist/*.whl')[0]; z=zipfile.ZipFile(p); a=z.namelist(); assert all(any(x.endswith('/studio_assets/'+n) for x in a) for n in ('index.html','studio.css','studio.js')), a"
      - name: Tests
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q src

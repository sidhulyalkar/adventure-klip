name: K-TIDE CPU smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ktide-smoke.yml'
      - 'src/adventure_intelligence/encoder_*.py'
      - 'src/adventure_intelligence/ktide_*.py'
      - 'scripts/klip_*ktide.py'
      - 'tests/test_ktide_*.py'
      - 'tests/test_encoder_dataset.py'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  synthetic-train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU-only PyTorch and K-TIDE extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[encoder,dev]'
      - name: Run actual temporal encoder training and data tests
        run: |
          python -m pytest -q tests/test_encoder_dataset.py tests/test_ktide_export.py tests/test_ktide_training.py
      - name: Compile optional model and tools
        run: |
          python -m compileall -q src/adventure_intelligence/ktide_model.py src/adventure_intelligence/ktide_train.py
